name: Temporary generator safety validation

on:
  push:
    branches: [agent-agnostic]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Check formatting
        run: test -z "$(gofmt -l tools/newgame/*.go)"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
