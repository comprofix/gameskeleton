name: Go validation

on:
  push:
    branches:
      - agent-agnostic

permissions:
  contents: read

jobs:
  validate:
    name: Format, build, vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true
      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
